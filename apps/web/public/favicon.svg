<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C1A32" />
      <stop offset="100%" stop-color="#2D0A17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D194" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <!-- Royal Crest Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- Inner Delicate Beaded Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.7" />
  <!-- Monogram JF in Fraunces/Cormorant Serif Style -->
  <text x="32" y="39" 
        font-family="'Fraunces', Georgia, 'Times New Roman', serif" 
        font-size="22" 
        font-weight="600" 
        font-style="italic" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="-0.5">JF</text>
  <!-- Tiny Botanical Atelier Diamond Dot -->
  <circle cx="32" cy="16" r="1.5" fill="url(#goldGrad)" />
  <circle cx="32" cy="48" r="1.5" fill="url(#goldGrad)" />
</svg>
